name: CLI Publish

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0). Leave empty to use package.json version.'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Type check
        run: bunx tsc --noEmit

      - name: Set version from tag
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          echo "Publishing version $TAG_VERSION (from tag $GITHUB_REF_NAME)"
          # Update package.json to match tag version
          bun run -e "const pkg = require('./package.json'); pkg.version = '$TAG_VERSION'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n')"

      - name: Set version from manual input
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          echo "Publishing version ${{ inputs.version }}"
          bun run -e "const pkg = require('./package.json'); pkg.version = '${{ inputs.version }}'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n')"

      - name: Show current version
        run: cat package.json | grep '"version"'

      - name: Configure npm auth
        run: |
          # Bun reads .npmrc from the project directory (where package.json lives)
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: bun publish --access public
        env:
          BUN_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        if: always()
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "### ✅ Published @zerone-agent/zhub" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
