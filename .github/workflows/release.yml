name: Release

# 打 `hub-v*` tag 时触发：跑完整 lint + test 通过后，构建镜像并推送
# `${REGISTRY_IMAGE}:vX.Y.Z` 和 `${REGISTRY_IMAGE}:latest`。
#
# tag 命名约定：git tag 用 `hub-v*` 前缀（避免和其他仓库 / 项目的 tag
# 撞名），构建 docker 镜像时剥掉 `hub-` 前缀，image tag 用 `v*`
# （符合 docker / semver 生态习惯）。

on:
  push:
    tags:
      - 'hub-v*'

env:
  GOPROXY: "https://mirrors.aliyun.com/goproxy/,https://goproxy.huaweicloud.com,direct"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - run: go vet ./...
      - name: Check gofmt
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "以下文件未通过 gofmt 格式检查:"
            echo "$output"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    # MySQL 8 service：供 pkg/database 的 migration 冒烟/升级测试
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: hub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_MYSQL_DSN: root:test@tcp(127.0.0.1:3306)/hub?parseTime=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - run: go build ./...
      - run: go test -v ./...

  frontend-test-full:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check and run full test suite
        run: |
          npx tsc --noEmit &
          TSC_PID=$!
          npm run test:run
          TEST_EXIT=$?
          wait $TSC_PID
          TSC_EXIT=$?
          if [ $TEST_EXIT -ne 0 ] || [ $TSC_EXIT -ne 0 ]; then
            exit 1
          fi

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint .

  push:
    runs-on: ubuntu-latest
    needs: [lint, test, frontend-test-full, frontend-lint]
    steps:
      - uses: actions/checkout@v4

      # 登录两个 registry：华为 SWR（国内主推）+ Docker Hub（国际/兜底）
      # 两套凭据互相独立，缺一个不影响另一个登录。
      - name: Login to SWR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          # 剥掉 git tag 的 "hub-" 前缀：hub-v1.2.3 → v1.2.3
          TAG="${GITHUB_REF_NAME#hub-}"

          # SemVer 2.0 pre-release 检测：含 "-" 后缀（如 -test/-beta/-rc.1）
          # 视为预发布，只推 :TAG，不更新 :latest。
          # 稳定版本（v1.2.3）和 build metadata（v1.2.3+build）都会更新 latest。
          IS_PRERELEASE=false
          if [[ "$TAG" == *-* ]]; then
            IS_PRERELEASE=true
            echo "🚧 Pre-release detected: $TAG — skipping :latest update"
          else
            echo "✅ Stable release: $TAG — will update :latest"
          fi

          # 所有要推送的目标镜像全路径（含 registry host）。
          # 约定：
          #   REGISTRY_IMAGE  = SWR 完整路径（如 swr.cn-east-3.myhuaweicloud.com/zerone/agent-hub）
          #   DOCKERHUB_IMAGE = Docker Hub 不含 host 的 namespace/repo（如 zeroneai/agent-hub）
          # 任一变量未配置则跳过该 registry，避免 CI 因漏配直接挂掉。
          declare -a TARGETS=()
          if [ -n "${{ vars.REGISTRY_IMAGE }}" ]; then
            TARGETS+=("${{ vars.REGISTRY_IMAGE }}")
          fi
          if [ -n "${{ vars.DOCKERHUB_IMAGE }}" ]; then
            TARGETS+=("docker.io/${{ vars.DOCKERHUB_IMAGE }}")
          fi

          if [ ${#TARGETS[@]} -eq 0 ]; then
            echo "❌ 未配置任何 registry（REGISTRY_IMAGE 或 DOCKERHUB_IMAGE 至少需要一个）"
            exit 1
          fi

          # 构建一次，用第一个 target 占位打 tag
          echo "Building ${TARGETS[0]}:$TAG (from git tag $GITHUB_REF_NAME)"
          docker build --provenance=false -f Dockerfile -t "${TARGETS[0]}:$TAG" .

          # 给每个 target 推 :TAG；稳定版本同时更新 :latest
          for IMAGE in "${TARGETS[@]}"; do
            echo "→ Pushing $IMAGE:$TAG"
            docker tag "${TARGETS[0]}:$TAG" "$IMAGE:$TAG"
            docker push "$IMAGE:$TAG"
            if [ "$IS_PRERELEASE" = false ]; then
              echo "→ Updating $IMAGE:latest"
              docker tag "${TARGETS[0]}:$TAG" "$IMAGE:latest"
              docker push "$IMAGE:latest"
            fi
          done

      - name: Logout from registries
        if: always()
        run: |
          docker logout ${{ vars.REGISTRY_HOST }} || true
          docker logout docker.io || true
