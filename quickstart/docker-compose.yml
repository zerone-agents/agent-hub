# agent-hub Quick Start (builtin auth mode)
#
# Brings up MySQL 8 + the agent-hub server (backend + embedded frontend) in
# the built-in user-system mode (username/password, admin-invite). No external
# identity provider required — first visit shows a setup screen to create the
# initial `admin` account.
#
# Usage:
#   cp .env.example .env   # then edit .env (set AUTH_JWT_SECRET etc.)
#   docker compose up -d --build
#   open http://localhost:${HUB_PORT:-8081}/static/
#
# The server image is built from the repository root Dockerfile, which compiles
# the frontend (vite) and embeds it into the Go binary (served at /static/).

services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_hub}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not exposing 3306 by default; uncomment to inspect from the host:
    # ports: ["3306:3306"]

  hub:
    # Build from the repository root (where the Dockerfile lives).
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # --- Auth (builtin mode) ---
      AUTH_MODE: builtin
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required (run openssl rand -hex 32)}
      # --- Database ---
      DATABASE_URL: root:${MYSQL_ROOT_PASSWORD:-root}@tcp(mysql:3306)/${MYSQL_DATABASE:-agent_hub}?charset=utf8mb4&parseTime=True
      DATABASE_MAX_OPEN: ${DATABASE_MAX_OPEN:-50}
      # --- Server ---
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: ${HUB_PORT:-8081}
      # --- Optional integrations (leave empty to disable) ---
      # Provider API-key encryption key (set for managing model providers):
      PROVIDER_ENCRYPTION_KEY: ${PROVIDER_ENCRYPTION_KEY:-}
      AGENT_DEPLOYER_URL: ${AGENT_DEPLOYER_URL:-}
      AGENT_DEPLOYER_API_KEY: ${AGENT_DEPLOYER_API_KEY:-}
      KONG_ADMIN_URL: ${KONG_ADMIN_URL:-}
      MULTIRAG_BASE_URL: ${MULTIRAG_BASE_URL:-}
      MULTIRAG_API_KEY: ${MULTIRAG_API_KEY:-}
    ports:
      - "${HUB_PORT:-8081}:${HUB_PORT:-8081}"

volumes:
  mysql_data:
