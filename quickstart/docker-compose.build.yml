# Build-from-source override for docker-compose.yml.
#
# The default docker-compose.yml pulls a prebuilt image. Use this file to build
# the hub image locally from the repository source (frontend + backend compiled
# in the Dockerfile at the repo root).
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# This override merges with the base file: it adds a `build` section to the hub
# service. Docker Compose then builds the image and tags it with the `image`
# name declared in docker-compose.yml.

services:
  hub:
    build:
      context: ..
      dockerfile: Dockerfile
